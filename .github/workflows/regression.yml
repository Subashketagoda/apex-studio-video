name: Python regression checks

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
  workflow_dispatch:

jobs:
  approval-and-render-smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run offline regression tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q tests/test_pipeline_approval_default.py tests/test_scene_approval_engine.py -k "not full_pipeline_render_approved_job"
